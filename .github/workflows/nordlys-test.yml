name: Nordlys Test

on:
  workflow_call:

jobs:
  test:
    name: Test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux legs run on the Modal "ci" pool (deployed from runners/).
          # The trailing pin makes the label set unique per leg so each JIT
          # runner is claimed by exactly one leg. NOTE: ${{ strategy.job-index }}
          # is not available inside matrix values, so suffixes are literals.
          - { os: linux, runner: [self-hosted, modal, ci, "job-${{ github.run_id }}-${{ github.job }}-py311"], python: "3.11" }
          - { os: linux, runner: [self-hosted, modal, ci, "job-${{ github.run_id }}-${{ github.job }}-py312"], python: "3.12", lint: true }
          - { os: linux, runner: [self-hosted, modal, ci, "job-${{ github.run_id }}-${{ github.job }}-py313"], python: "3.13" }
          # T4 on the Modal "ci-gpu" pool; CUDA wheels via --extra cu12. Allowed
          # to fail until the CUDA-guarded tests are proven green (never ran in CI).
          - { os: linux-gpu, runner: [self-hosted, modal, ci-gpu, "job-${{ github.run_id }}-${{ github.job }}-gpu"], python: "3.12", extra: cu12, cuda_visible: "0", allow_failure: true }
          - { os: macos, runner: macos-latest, python: "3.11" }
          - { os: macos, runner: macos-latest, python: "3.12" }
          - { os: macos, runner: macos-latest, python: "3.13" }
          - { os: windows, runner: blacksmith-4vcpu-windows-2025, python: "3.11" }
          - { os: windows, runner: blacksmith-4vcpu-windows-2025, python: "3.12" }
          - { os: windows, runner: blacksmith-4vcpu-windows-2025, python: "3.13" }

    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install package (dev + ${{ matrix.extra || 'cpu' }} backend)
        working-directory: nordlys
        run: uv sync --group dev --extra ${{ matrix.extra || 'cpu' }}

      - name: Lint
        if: matrix.lint
        working-directory: nordlys
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
          uv run ty check

      - name: Build distribution
        working-directory: nordlys
        run: uv build

      - name: Test
        working-directory: nordlys
        env:
          # Empty hides GPUs (default everywhere); "0" on the linux-gpu leg.
          CUDA_VISIBLE_DEVICES: ${{ matrix.cuda_visible }}
        run: uv run pytest tests -v --tb=short
